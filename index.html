C.push({id:"auction",title:"The Harbour Auction Forgery",icon:"🖼️",place:"Harcourt & Lowe auction house, London",level:"Medium",start:"s0",hub:"gallery",hl:"Back to the gallery",S:{
s0:{t:"Six hours before the sale, a 17th-century seascape, Storm Over Calder Bay, is the star lot at Harcourt & Lowe. A junior cataloguer holds the painting under a lamp and frowns: “The sky looks wrong.” If it is a fake, someone swapped it for a copy and the real one is gone.",c:[["Enter the gallery","gallery"]]},
gallery:{i:"🖼️",t:"Footsteps echo on polished floors. Auctioneer Mr. Harcourt, restorer Isabel Moreau, collector Mr. Whitcombe, security chief Daniel Reyes and journalist Hannah Cole are all in the building.",c:[["Examine the lot","lot","!v_lot"],["Visit the restoration studio","studio","studiohint,!v_studio"],["Check the shipping desk","desk","deskhint,!v_desk"],["Talk to Mr. Harcourt","harcourt","!v_h_ask,!v_h_push"],["Talk to Mr. Whitcombe","whit","!v_w_ask,!v_w_push"],["Talk to Daniel Reyes","reyes","!v_r_ask,!v_r_push"],["Talk to Hannah Cole","hannah","!v_n_ask,!v_n_push"],["Question Isabel Moreau","isabel"],["Make your accusation","accuse"]]},
lot:{i:"🔦",t:"The painting looks perfect in normal light. A heavy gilt frame, a cracked varnish, a stormy sky.",n:"The lot looks genuine in ordinary light.",c:[["Use the UV lamp","uv","!v_uv"],["Inspect the back of the frame","frame","!v_frame"]],b:"gallery"},
uv:{t:"Under ultraviolet light the sky glows bright white where old paint should look dull. That is titanium white, a pigment not invented until the 1920s. The painting is a modern copy.",n:"UV light shows modern titanium white paint in the sky: the lot is a copy.",f:"uv",b:"lot"},
frame:{t:"The back is sealed with fresh blue conservator’s tape, with a smudged initial: “I.M.”",n:"The frame back carries blue conservator’s tape initialled “I.M.”",f:"crate",b:"lot"},
studio:{i:"🎨",t:"The studio smells of turpentine. On a shelf: a nearly empty tube of titanium white, canvas offcuts with fresh craquelure varnish, and a pencil sketch of the seascape’s sky.",n:"Isabel’s studio holds titanium white paint, varnished canvas offcuts and a sketch of the sky.",f:"pigment",b:"gallery"},
desk:{i:"📦",t:"The shipping desk ledger lists a private courier invoice to a Geneva address, dated yesterday, for “one framed work, restored”, signed by Moreau Conservation Ltd.",n:"A private shipping invoice to Geneva was signed by Moreau Conservation Ltd.",f:"invoice",b:"gallery"},
harcourt:{i:"🎩",t:"Mr. Harcourt straightens his waistcoat. He looks more worried than a man who owns the house should.",c:[["Ask how the painting was handled","h_ask"],["Ask about the auction house’s finances","h_push"]]},
h_ask:{t:"Only Isabel Moreau handled the painting for six weeks of cleaning. He adds that the shipping desk logs every movement in and out.",n:"Only Isabel Moreau handled the painting for six weeks; the shipping desk logs every movement.",f:"deskhint",b:"gallery"},
h_push:{t:"His face tightens. “That is none of your business.” He leaves you standing in the empty salesroom.",n:"Mr. Harcourt walked out when you asked about finances.",f:"harcourt_gone",b:"gallery"},
whit:{i:"🧐",t:"Mr. Whitcombe leans on his cane, eyeing you coolly.",c:[["Ask about his interest in the lot","w_ask"],["Say he must have wanted it badly enough to steal it","w_push"]]},
w_ask:{t:"He offered Isabel two million privately last month and she refused. He says the sky looked wrong to him the moment he saw it on view.",n:"Whitcombe offered Isabel two million privately, and she refused.",f:"whit_ok",b:"gallery"},
w_push:{t:"He raps his cane on the floor. “Outrageous!” He leaves with his solicitor’s number on the tip of his tongue.",n:"Whitcombe stormed out with a solicitor’s threat.",f:"whit_gone",b:"gallery"},
reyes:{i:"🛡️",t:"Daniel Reyes watches the doors, radio crackling on his shoulder.",c:[["Ask about the crate’s movements","r_ask"],["Say security must be involved","r_push"]]},
r_ask:{t:"The crate left Isabel’s studio on Tuesday sealed with her blue tape. Nobody opened it until now. He logged the weight at the time, and it matched.",n:"The crate left Isabel’s studio sealed with her blue tape; nobody opened it afterwards.",f:"studiohint",b:"gallery"},
r_push:{t:"His jaw tightens. “I have run security for twenty years.” He refuses to answer further and posts a guard on you.",n:"Reyes closed up and had you watched after you accused him.",f:"reyes_gone",b:"gallery"},
hannah:{i:"📓",t:"Hannah Cole taps her notebook, eager for a story.",c:[["Ask what she noticed","n_ask"],["Accuse her of sneaking into the vault","n_push"]]},
n_ask:{t:"She slipped into the vault at midnight for a preview. The sky was “too bright”, she says, and it smelled of fresh varnish, which an old painting should not.",n:"Hannah saw the painting at midnight: the sky was too bright and smelled of fresh varnish.",f:"hannah_ok",b:"gallery"},
n_push:{t:"She snaps her notebook shut. “I will write about this.” She walks off and every reporter in the building follows her.",n:"Hannah left angrily and the press turned against you.",f:"hannah_gone",b:"gallery"},
isabel:{i:"🖌️",t:"Isabel Moreau wipes paint from her fingers, composed and polite.",c:[["Chat about the restoration","i_chat","!v_i_chat"],["Show her the UV result","i_uv","uv,!v_i_uv"],["Show her the pigment and sketch","i_pig","pigment,!v_i_pig"],["Accuse her with no proof","i_blunt","!pigment,!v_i_blunt"]],b:"gallery"},
i_chat:{t:"She says the cleaning went smoothly. “I only touched the varnish, never the second canvas.” Nobody had mentioned a second canvas.",n:"Isabel mentioned a “second canvas” before anyone told her the lot was a copy.",f:"slip",b:"isabel"},
i_uv:{t:"She goes still. “Any restorer uses titanium white for retouching.” But she cannot explain why an entire sky glows with it.",n:"Isabel could not explain why the whole sky glows with modern white.",b:"isabel"},
i_pig:{t:"“Studio supplies,” she says, too lightly. But the sketch of the sky matches the copy line for line.",n:"Isabel’s sketch matches the copy’s sky line for line.",b:"isabel"},
i_blunt:{t:"She smiles thinly. “Let me fetch some tea.” By the time you check the studio, the canvases and sketches are gone.",n:"Isabel’s studio was emptied after your blunt accusation.",f:"studio_cleared",b:"gallery"},
accuse:{i:"⚖️",t:"The sale is about to begin and the room hushes. Who swapped the painting?",c:[["Isabel Moreau","ac_isabel"],["Mr. Harcourt","end_harcourt"],["Mr. Whitcombe","end_whit"],["Daniel Reyes","end_reyes"],["Hannah Cole","end_hannah"],["Ask Isabel quietly to bring the real painting home","secret_auction","slip,uv,!whit_gone,!hannah_gone"],["Not yet","gallery"]]},
ac_isabel:{r:[["studio_cleared","end_studio"],["","ac_i2"]]},
ac_i2:{g:[["uv","pigment","crate","invoice","slip"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs close the net. Isabel confesses she painted the copy to pay off debts and shipped the original to a buyer in Geneva. Customs stops the package at the border, and the real Storm Over Calder Bay is back on the wall before the sale."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Isabel crumbles under your evidence. The original is traced to Geneva and returned, though the sale is postponed by a week."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Isabel, but without strong proof she walks out with her solicitor. The real painting is never recovered."},
end_studio:{e:"The Cleaned Studio",k:"weak",i:"🧹",t:"You were right, but too early. The canvases and sketches vanished, and Isabel is never charged."},
end_harcourt:{e:"The Auctioneer’s Fall",k:"fail",i:"🎩",t:"Mr. Harcourt is arrested in front of the press. His finances are a mess, but he is no thief. The house is ruined by the scandal."},
end_whit:{e:"The Collector’s Revenge",k:"fail",i:"🧐",t:"Whitcombe sues for defamation and wins. The real thief shreds the invoice and moves on."},
end_reyes:{e:"The Guard’s Dismissal",k:"fail",i:"🛡️",t:"Reyes is fired and the vault is left unwatched. A week later, the copy is the least of the house’s worries."},
end_hannah:{e:"Breaking the Story",k:"fail",i:"📓",t:"Hannah publishes the story of your false accusation. You are the headline, and the forger enjoys her tea."},
secret_auction:{e:"The Honest Brushstroke",k:"win",s:1,i:"🎨",t:"You find Isabel alone in the studio and quietly lay out the UV result and her slip. She sets down her brush, and an hour later she brings the real painting from a storage unit in the city. The sale goes ahead, with her copy displayed beside the original as a lesson in the restorer’s craft. Harcourt keeps the house, and Isabel quietly steps back from the trade."}
}});
C.push({id:"lighthouse",title:"The Ghost of Gull Rock",icon:"🏮",place:"Gull Rock Lighthouse, a seaside town",level:"Easy",start:"s0",hub:"cliff",hl:"Back to the clifftop",S:{
s0:{t:"For three nights a ghostly blue light has glowed from the old Gull Rock Lighthouse. Tourists have fled, fishermen are muttering, and the museum opening is in two days. Mayor Pearce hands you the old brass key. “Find out what is haunting my lighthouse.”",c:[["Walk up to the lighthouse","cliff"]]},
cliff:{i:"🏮",t:"Gulls wheel and the wind tugs at your coat. Old keeper Bram, tour guide Nell, fisherman Cal, historian Dr. Voss and young Ollie have all come to watch.",c:[["Climb to the lamp room","lamp","!v_lamp"],["Search the cellar","cellar","cellarhint,!v_cellar"],["Search Dr. Voss’s room at the inn","room","mudhint,!v_room"],["Talk to Bram, the keeper","bram","!v_b_ask,!v_b_push"],["Talk to Nell, the tour guide","nell","!v_n_ask,!v_n_push"],["Talk to Cal, the fisherman","cal","!v_c_ask,!v_c_push"],["Talk to Ollie","ollie","!v_o_ask,!v_o_push"],["Question Dr. Voss","voss"],["Make your accusation","accuse"]]},
lamp:{i:"💡",t:"The old lens is cold and dusty. But tucked under it: a battery pack and a strip of LED lights behind a blue filter, held with fresh tape.",n:"A blue-filtered LED strip and battery pack are hidden under the old lens.",f:"led",b:"cliff"},
cellar:{i:"⛏️",t:"Damp stone walls, and a corner torn open. Fresh clay is heaped beside a half-dug trench, and a trowel lies in the mud.",n:"Someone has dug a fresh trench in the lighthouse cellar.",f:"dig",c:[["Check the trowel","trowel","!v_trowel"]],b:"cliff"},
trowel:{t:"The trowel’s handle is scratched with tiny initials: “A.V.”",n:"The trowel is initialled “A.V.”",f:"initials",b:"cellar"},
room:{i:"🛏️",t:"Dr. Voss’s room at the inn is neat. In the desk: a hand-drawn map of the lighthouse cellar with a large X, and a pair of muddy boots by the door.",n:"Dr. Voss’s room holds a hand-drawn cellar map with an X and muddy boots.",f:"map,mud",b:"cliff"},
bram:{i:"🧓",t:"Bram leans on his cane, eyes on the horizon.",c:[["Ask about the ghost","b_ask"],["Say he is staging it for attention","b_push"]]},
b_ask:{t:"Forty years he has kept this light. The legend says a blue lantern means danger on the rocks, but he says this light is “too steady for a ghost”. He heard digging at night and thought it was rats.",n:"Bram heard digging at night, and the blue light is too steady for a ghost.",f:"cellarhint",b:"cliff"},
b_push:{t:"His face crumples. “After forty years?” He walks back to his cottage and shuts the door.",n:"Bram shut himself away after you accused him.",f:"bram_gone",b:"cliff"},
nell:{i:"🧳",t:"Nell checks her tour schedule, frazzled.",c:[["Ask about the fleeing tourists","n_ask"],["Accuse her of faking a haunting","n_push"]]},
n_ask:{t:"She says the light has cost her half her bookings. At 1 AM last night she saw a car parked on the cliff road, a silver estate with a dented bumper.",n:"Nell saw a silver estate car parked on the cliff road at 1 AM.",f:"mudhint",b:"cliff"},
n_push:{t:"“I need these tourists!” Nell storms off, and the other guides stop speaking to you.",n:"Nell left angrily after you accused her.",f:"nell_gone",b:"cliff"},
cal:{i:"🎣",t:"Cal mends his nets, weathered and quiet.",c:[["Ask about dawn on the water","c_ask"],["Ask if the fishermen planted the light","c_push"]]},
c_ask:{t:"At dawn he saw a figure climbing down the rock path with a spade and a lantern. The coat was long and the boots looked brand new.",n:"Cal saw a figure with a spade and lantern climbing down at dawn.",f:"cellarhint,mudhint",b:"cliff"},
c_push:{t:"He drops the net. “Ask your questions somewhere else.” The harbour goes quiet when you pass.",n:"Cal and the harbour folk stopped helping.",f:"cal_gone",b:"cliff"},
ollie:{i:"🧒",t:"Ollie kicks a stone, bright-eyed and eager.",c:[["Ask what he saw","o_ask"],["Ask if he is playing a prank","o_push"]]},
o_ask:{t:"He saw the blue light flicker on just before a man in a long coat climbed down with a bag. “He had tiny glasses,” Ollie whispers. “Like the professor.”",n:"Ollie saw a man in a long coat and small glasses leave after the blue light flicked on.",f:"mudhint",b:"cliff"},
o_push:{t:"Ollie’s lip trembles. “I did not do anything!” He runs home, and his mother glares at you.",n:"Ollie ran off crying after you accused him.",f:"ollie_gone",b:"cliff"},
voss:{i:"🧑‍🏫",t:"Dr. Voss adjusts his glasses, smiling politely.",c:[["Chat about the legend","v_chat","!v_v_chat"],["Show him the LED strip","v_led","led,!v_v_led"],["Show him the map","v_map","map,!v_v_map"],["Accuse him with no proof","v_blunt","!map,!v_v_blunt"]],b:"cliff"},
v_chat:{t:"He laughs. “A man could dig all night for that smugglers’ chest and never find it with the clay so wet.” Nobody had mentioned a chest.",n:"Dr. Voss mentioned a smugglers’ chest before anyone told him anything about it.",f:"slip",b:"voss"},
v_led:{t:"“Maybe a prankster,” he says. But the tape on the LED strip matches the tape roll in his coat pocket.",n:"The LED tape matches a roll in Dr. Voss’s coat pocket.",b:"voss"},
v_map:{t:"He goes pale. “That is research!” But the X on the map is exactly where the trench was dug.",n:"The X on Voss’s map marks the exact spot of the cellar trench.",b:"voss"},
v_blunt:{t:"He chuckles. “Prove it.” That night the trench is filled in, the LED strip is gone, and the map is nowhere to be found.",n:"The evidence vanished after your blunt accusation.",f:"cleared",b:"cliff"},
accuse:{i:"⚖️",t:"The whole town waits at the foot of the lighthouse as the sun sets. Who is behind the ghost?",c:[["Dr. Voss","ac_voss"],["Bram, the keeper","end_bram"],["Nell, the guide","end_nell"],["Cal, the fisherman","end_cal"],["Ollie","end_ollie"],["Ask Dr. Voss to turn the ghost into an attraction","secret_ghost","slip,dig,!bram_gone,!ollie_gone"],["Not yet","cliff"]]},
ac_voss:{r:[["cleared","end_cleared"],["","ac_v2"]]},
ac_v2:{g:[["led","dig","map","mud","slip"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs pin Dr. Voss down. He admits he faked the ghost to scare people away while he searched the cellar for a smugglers’ chest. The mayor fines him, the town keeps the lighthouse, and the museum opens on time."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Dr. Voss confesses under the weight of your evidence. The ghost lights go out, and the museum opens a day late."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Dr. Voss, but he calmly explains everything away. The ghost returns the next night, and the museum never opens."},
end_cleared:{e:"The Filled Trench",k:"weak",i:"🕳️",t:"You were right, but too early. The trench is filled, the strip is gone, and nobody can prove a thing."},
end_bram:{e:"The Keeper’s Heartbreak",k:"fail",i:"🧓",t:"Bram is forced to leave the lighthouse after forty years. The ghost light returns the next night, brighter than ever."},
end_nell:{e:"Bookings Cancelled",k:"fail",i:"🧳",t:"Nell loses her job and the town loses its best guide. The real culprit buys her a coffee."},
end_cal:{e:"The Harbour Boycott",k:"fail",i:"🎣",t:"The fishermen refuse to take anyone out, and the town goes quiet. Cal never stole anything."},
end_ollie:{e:"A Child’s Tears",k:"fail",i:"🧒",t:"Ollie is grounded for a month and the whole town scolds you. The ghost never needed a child."},
secret_ghost:{e:"The Ghost Night",k:"win",s:1,i:"👻",t:"You take Dr. Voss aside and quietly lay out the slip and the trench. Ashamed, he confesses and offers to help. With Bram telling the legend and Ollie handing out lanterns, the town turns the blue light into a yearly Ghost Night. The cellar dig finds an old smugglers’ chest, the museum has its star exhibit, and the lighthouse has never been so well loved."}
}});
C.push({id:"starship",title:"The Silent Starship",icon:"🚀",place:"Deep-space cargo ship Meridian",level:"Medium",start:"s0",hub:"bridge",hl:"Back to the bridge",S:{
s0:{t:"Day 212 aboard the cargo ship Meridian. At 02:00 ship time the AI, ORIN, went dark, and the quantum navigation core was pulled from its slot. Without it the ship is drifting toward an asteroid belt, nine hours away. Captain Mara Quill grips your arm: “One of my crew did this. Find them before we hit the rocks.”",c:[["Step onto the bridge","bridge"]]},
bridge:{i:"🚀",t:"Dim emergency lights hum. Captain Quill, engineer Jax Ortega, pilot Nova Chen, science officer Dr. Ilya Petrov and the service robot Bo are all on the bridge, and the countdown ticks on the main screen.",c:[["Inspect the nav console","console","!v_console"],["Check the airlock log","airlock","airhint,!v_airlock"],["Restore ORIN’s backup","orin","orinhint,!v_orin"],["Search the cargo bay","cargo","cargohint,!v_cargo"],["Talk to Captain Quill","quill","!v_q_ask,!v_q_push"],["Talk to Jax, the engineer","jax","!v_j_ask,!v_j_push"],["Talk to Nova, the pilot","nova","!v_n_ask,!v_n_push"],["Talk to Bo, the service robot","bo","!v_b_ask,!v_b_push"],["Question Dr. Petrov","petrov"],["Make your accusation","accuse"]]},
console:{i:"🖥️",t:"The core slot is empty and cold. No force was used, so the thief had the access code.",n:"The nav core was removed without force by someone with the access code.",c:[["Scan the core slot","slot","!v_slot"]],b:"bridge"},
slot:{t:"The scanner picks up a faint blue residue on the rim: cryo-gel, the kind used only in the science lab.",n:"Cryo-gel residue, used only in the science lab, was found on the core slot.",f:"gel",b:"console"},
airlock:{i:"🚪",t:"The outer airlock cycled at 02:14 under “maintenance” clearance, a code only officers hold. Nothing was ejected, but something small was moved.",n:"The outer airlock cycled at 02:14 using an officer’s maintenance clearance.",f:"airlock",b:"bridge"},
orin:{i:"🤖",t:"ORIN’s backup flickers to life. Its voice is thin: “Dr. Petrov requested diagnostic mode at 01:58. I was shut down at 02:00.”",n:"ORIN’s backup says Dr. Petrov put it in diagnostic mode just before the shutdown.",f:"orin",b:"bridge"},
cargo:{i:"📦",t:"In bay three, behind a rack of crates, a sealed cryo-case hums softly. Inside, wrapped in foam: the quantum navigation core.",n:"The nav core was hidden in a sealed cryo-case in cargo bay three.",f:"core",b:"bridge"},
quill:{i:"🧑‍✈️",t:"Captain Quill paces, jaw tight.",c:[["Ask about last night","q_ask"],["Ask why she locked the bridge","q_push"]]},
q_ask:{t:"She locked the bridge at 01:30 and went to her quarters. She adds that ORIN keeps a backup in the maintenance bay, and that only officers can cycle the airlock.",n:"Only officers can cycle the airlock, and ORIN keeps a backup in the maintenance bay.",f:"orinhint,airhint",b:"bridge"},
q_push:{t:"Her eyes harden. “I am the captain of this ship!” She orders you off the bridge and the crew stops cooperating.",n:"Captain Quill ordered you off the bridge after you questioned her.",f:"quill_gone",b:"bridge"},
jax:{i:"🔧",t:"Jax wipes coolant from his hands, tired and tense.",c:[["Ask what he heard","j_ask"],["Ask if he sabotaged the core","j_push"]]},
j_ask:{t:"He was fixing a coolant pump when the outer airlock cycled at 02:14. A few minutes later the cargo bay lights flickered.",n:"Jax heard the airlock cycle at 02:14 and saw the cargo bay lights flicker.",f:"airhint,cargohint",b:"bridge"},
j_push:{t:"“I keep this ship alive!” He drops his wrench and stalks off to the engine room.",n:"Jax stormed off after you accused him.",f:"jax_gone",b:"bridge"},
nova:{i:"👩‍🚀",t:"Nova taps her console, worried about the heading.",c:[["Ask about the ship’s heading","n_ask"],["Say the pilot always knows more","n_push"]]},
n_ask:{t:"She says ORIN would never shut down on its own. Its backup memory sits in the maintenance bay, and the drift was set deliberately, three degrees toward the belt.",n:"Nova says ORIN would never shut down on its own and the drift was set deliberately.",f:"orinhint",b:"bridge"},
n_push:{t:"Nova’s face falls. “I fly this ship, I do not sink it.” She sits at her console and goes silent.",n:"Nova stopped helping after you accused her.",f:"nova_gone",b:"bridge"},
bo:{i:"🤖",t:"Bo’s round head tilts, optic ring glowing. It beeps in an uncertain pattern.",c:[["Ask Bo what it saw","b_ask"],["Order Bo to shut up","b_push"]]},
b_ask:{t:"Bo plays back a short clip: at 02:20 Dr. Petrov carries a cryo-case toward cargo bay three. Bo was told to forget it.",n:"Bo recorded Dr. Petrov carrying a cryo-case toward cargo bay three at 02:20.",f:"cargohint",b:"bridge"},
b_push:{t:"Bo’s ring dims. It shuts itself down and refuses to restart.",n:"Bo shut down after you gave it an order.",f:"bo_gone",b:"bridge"},
petrov:{i:"🧪",t:"Dr. Petrov adjusts his glasses, calm as a lab report.",c:[["Chat about the situation","p_chat","!v_p_chat"],["Show him the cryo-gel residue","p_gel","gel,!v_p_gel"],["Show him the airlock log","p_air","airlock,!v_p_air"],["Accuse him with no proof","p_blunt","!core,!v_p_blunt"]],b:"bridge"},
p_chat:{t:"He sighs. “A drifting ship reaches the belt in nine hours. We should wake the crew.” Nobody had told him the exact time to the belt.",n:"Petrov quoted the nine-hour time to the belt before anyone told him.",f:"slip",b:"petrov"},
p_gel:{t:"“Everyone uses the lab,” he says, but his gloves are stained the same blue.",n:"Petrov’s gloves carry the same blue cryo-gel.",b:"petrov"},
p_air:{t:"He shrugs. “Maintenance clearance is shared among officers.” But only he was in the science bay at 02:14.",n:"Petrov was alone in the science bay at 02:14.",b:"petrov"},
p_blunt:{t:"He smiles thinly. “Prove it.” He excuses himself, and a moment later the cargo bay airlock cycles. The cryo-case is gone into the dark.",n:"The cryo-case was ejected after your blunt accusation.",f:"core_gone",b:"bridge"},
accuse:{i:"⚖️",t:"The countdown reads two hours. The crew waits. Who removed the nav core?",c:[["Dr. Petrov","ac_pet"],["Captain Quill","end_quill"],["Jax","end_jax"],["Nova","end_nova"],["Bo","end_bo"],["Offer Dr. Petrov a way out","secret_ship","slip,orin,!quill_gone,!nova_gone"],["Not yet","bridge"]]},
ac_pet:{r:[["core_gone","end_core"],["","ac_pet2"]]},
ac_pet2:{g:[["gel","airlock","orin","core","slip"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs close the net. Petrov admits he sold the nav core to a pirate faction. The crew snaps the core back into its slot, ORIN reboots, and the Meridian burns clear of the belt with minutes to spare."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Petrov confesses under the weight of your evidence. The core is restored in time, though the ship takes a few bruises."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Petrov, but you lack the proof. He denies everything calmly, and the Meridian limps through the belt with half its sensors dead."},
end_core:{e:"Ejected Evidence",k:"weak",i:"☄️",t:"You were right, but too early. The cryo-case is somewhere in the dark, the core is gone, and the ship drifts on."},
end_quill:{e:"Mutiny",k:"fail",i:"🧑‍✈️",t:"You accuse the captain, and the crew splits. In the argument, the ship drifts closer to the belt, and the real culprit smiles."},
