<meta name="theme-color" content="#0a1114">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1114;--panel:#121c20;--line:#26373d;--text:#e6e9e4;--mute:#92a3a8;--acc:#5fb8aa;--red:#d4574b;--gold:#e3b95c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1000px 500px at 80% -10%,#15262b,transparent),var(--bg);color:var(--text);font:400 16px/1.6 "Work Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(280px circle at var(--mx,50%) var(--my,30%),#5fb8aa18,transparent)}
[hidden]{display:none!important}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:68px 16px 56px}
h1,h2,h3{font-family:"Special Elite","Courier New",monospace;font-weight:400;margin:0}
h1{font-size:clamp(26px,6vw,42px);line-height:1.1}
h2{font-size:19px;margin-bottom:10px}
.lead{color:var(--mute);max-width:62ch;margin:8px 0 22px}
.mute{color:var(--mute);font-size:14px}
a{color:var(--acc)}
.folders{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.folder{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:22px solid #2b4a52;border-radius:4px 14px 10px 10px;padding:14px 16px 16px;color:var(--text);cursor:pointer;font:inherit;transition:transform .15s,border-color .15s,box-shadow .2s;animation:rise2 .5s backwards}
.folder:nth-child(2){border-top-color:#4a3d2b}
.folder:hover{border-color:var(--acc);box-shadow:0 12px 28px #000b}
.folder h3{font-size:20px}.folder p{margin:4px 0;color:var(--mute);font-size:14px}
.fi{font-size:42px;line-height:1.1;animation:bob 3s ease-in-out infinite}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);font-family:"Special Elite",monospace;padding:1px 8px;transform:rotate(-4deg);font-size:13px;margin-top:6px;transition:transform .2s}
.stamp.new{border-color:var(--mute);color:var(--mute)}
.folder:hover .stamp{transform:rotate(-9deg) scale(1.1)}
.brand{display:flex;align-items:center;gap:14px}.brand svg{width:68px;height:68px;flex:none;filter:drop-shadow(0 4px 14px #5fb8aa55);animation:bob 3s ease-in-out infinite}
.top{display:flex;gap:18px;margin-bottom:8px}
.grid{display:grid;gap:16px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:820px){.grid{grid-template-columns:3fr 2fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;animation:rise2 .5s backwards}
.ic{font-size:54px;line-height:1;margin-bottom:8px;animation:bob 3s ease-in-out infinite,pop2 .5s}
#txt,.endt{max-width:68ch;margin:0 0 14px;min-height:3em}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:9px 0;border-radius:10px;border:1px solid var(--line);background:#10222a;color:var(--text);font:600 15px "Work Sans",sans-serif;cursor:pointer;animation:rise2 .45s backwards;transition:transform .18s,border-color .18s,background .18s,box-shadow .2s}
.choice::before{content:"\25B8  ";color:var(--acc)}
.choice:hover{border-color:var(--acc);transform:translateX(7px);background:#15303a;box-shadow:-4px 0 0 var(--acc)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.back{border:0;background:none;color:var(--acc);font:600 14px "Work Sans",sans-serif;padding:0;cursor:pointer}
#notes{list-style:none;padding:0;margin:0}
#notes li{padding:8px 10px;border:1px dashed var(--line);border-radius:6px;margin-bottom:8px;font-size:14px;animation:drop .55s cubic-bezier(.3,1.6,.5,1)}
button{font:600 14px "Work Sans",sans-serif;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label{display:grid;gap:4px;color:var(--mute);font-size:14px}
input{background:#0e171a;border:1px solid var(--line);border-radius:6px;color:var(--text);font:inherit;padding:8px 10px}
.me{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:#1d2f35;border:1px solid var(--acc);display:grid;place-items:center;font:22px "Special Elite",monospace;color:var(--acc)}
.info{flex:1;min-width:160px}.info b{font:20px "Special Elite",monospace}.info i{display:block;color:var(--mute)}
#pf{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20}
.pbtn{width:44px;height:44px;border-radius:50%;padding:0;font:18px "Special Elite",monospace;background:var(--panel);border-color:var(--acc);color:var(--acc)}
#pp{position:absolute;right:0;top:54px;width:min(340px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 14px 34px #000c;animation:pop2 .2s}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--gold);color:#1a1405;padding:8px 16px;border-radius:20px;font-weight:600;z-index:30;animation:rise 1.7s forwards}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.cf span{position:absolute;top:-40px;animation:fall 2.4s linear forwards}
.fl{position:fixed;inset:0;background:#d4574b;opacity:0;pointer-events:none;z-index:35;animation:fl .5s}
.bigstamp{position:fixed;left:50%;top:40%;z-index:50;pointer-events:none;font:400 clamp(28px,9vw,72px) "Special Elite",monospace;border:6px solid;padding:6px 22px;border-radius:8px;white-space:nowrap;animation:slam 2.4s forwards}
.bigstamp.ok{color:#7fd49a}.bigstamp.no{color:var(--red)}
@keyframes rise2{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes pop2{from{opacity:0;transform:scale(.6)}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes drop{from{opacity:0;transform:translateY(-22px) rotate(-5deg) scale(.9)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes fl{30%{opacity:.28}}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(4) rotate(-14deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}20%{transform:translate(-50%,-46%) scale(1.05) rotate(-8deg)}26%{transform:translate(-50%,-50%) scale(1) rotate(-8deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="pf"><button class="pbtn" id="pb" data-pt="1" aria-label="Profile">?</button><div id="pp" hidden></div></div>
<main class="wrap" id="app"></main>
<script>
var C=[
{id:"manor",title:"Death at Raventhorne",icon:"🥃",place:"Raventhorne Manor, a stormy night",level:"Hard",start:"s0",hub:"hall",hl:"Return to the hall",S:{
s0:{t:"Thunder rattles the windows. Lord Edmund Raventhorne lies dead in his locked study, a brandy glass beside him. The bridge is flooded, so the killer is still in the house. Where do you begin?",c:[["Examine the study","study"],["Gather the household in the hall","hall"]]},
study:{i:"🔎",t:"Edmund slumps at his desk. Two brandy glasses, a dying fire. The door was locked from inside, the key still in his pocket.",c:[["Sniff the used glass","glass","!v_glass"],["Inspect the door and keyhole","door","!v_door"],["Check the fireplace","fire","!v_fire"],["Go to the hall","hall"]]},
glass:{i:"🥃",t:"A bitter, chalky residue clings to the used glass. The second glass is clean, apart from a faint lipstick smudge.",n:"The used glass has a bitter residue; the second glass is clean but has lipstick on the rim.",b:"study"},
door:{i:"🚪",t:"Fresh scratches circle the keyhole, though the lock itself is intact. Something was forced into it recently.",n:"Fresh scratches circle the study keyhole; the lock is intact.",b:"study"},
fire:{i:"🔥",t:"Among the ashes, a half-burned page: “…to Celeste, nothing…”. Edmund was rewriting his will.",n:"A burned draft will cut Lady Celeste out.",f:"will",b:"study"},
hall:{i:"🕯️",t:"The household waits in the dim hall: Lady Celeste, Dr. Mehta, Victor, Mrs. Dsouza and Julian. Candles gutter. Everyone watches you.",c:[["Question Lady Celeste","celeste","!celeste_done"],["Question Dr. Mehta","mehta","!v_m_poison,!v_m_denies"],["Question Victor","victor","!v_v_saw,!v_v_shut"],["Question Mrs. Dsouza","dsouza","!v_d_pub,!v_d_priv"],["Question Julian","julian","!v_j_eye,!v_j_blunt"],["Examine the grandfather clock","clock","!v_clock"],["Search the pantry","pantry","pantry_clue,!v_pantry"],["Search the guest wing","guest","v_m_poison"],["Confront Dr. Mehta with the letter","m_confess","letter,!v_m_confess"],["Make your accusation","accuse"]]},
celeste:{i:"👩",t:"Lady Celeste dabs her eyes, composed but brittle. How do you approach her?",c:[["Ask gently about the argument","c_kind"],["Press her about the lipstick glass","c_hard"],["Bluff: say you found the burned will","c_bluff","will"]]},
c_kind:{t:"She admits arguing with Edmund at 10:40 about the will. She left in tears by 10:45 and heard him lock the door behind her. On her way out she saw Victor slipping down the back stairs.",n:"Edmund was alive and locked himself in after 10:45; Celeste saw Victor on the back stairs.",f:"celeste_done,sawvic",b:"hall"},
c_hard:{t:"Her face hardens. “You’re accusing me of killing my husband?” She sweeps out of the room, and nobody will speak for her.",n:"Celeste walked out when pressed about the lipstick glass.",f:"celeste_done",b:"hall"},
c_bluff:{t:"She goes white, then confesses the argument and the sleeping pills Mehta gave her, and that Victor sneaked down the back stairs at 10:50. The bluff worked.",n:"Celeste confirms the 10:40 argument; Victor was on the back stairs at 10:50.",f:"celeste_done,sawvic",b:"hall"},
mehta:{i:"🩺",t:"Dr. Mehta sits very still, hands clasped on his knees.",c:[["Ask about the poison","m_poison"],["Press him about his debt to Edmund","m_press"]]},
m_poison:{t:"“Digitalis overdose,” he says quickly. He treats Edmund’s heart with digoxin, and his own vial is half empty, which he claims was already so. He swears Edmund extended his debt.",n:"Death looks like a digoxin overdose; Mehta’s vial is half empty and he claims his debt was extended.",c:[["Press him about the debt","m_press"]],b:"hall"},
m_press:{r:[["letter","m_confess"],["","m_denies"]]},
m_denies:{t:"“I want my lawyer.” Mehta folds his arms and will say no more. You pushed without proof.",n:"Mehta refused to talk after being pressed without proof.",b:"hall"},
m_confess:{i:"💥",t:"You lay Edmund’s letter on the table. Mehta breaks. At 9 PM, Julian asked him for “something to make Edmund drowsy”, and he handed over a digoxin vial. At 10:50 he found Edmund dead and stopped the clock in a panic.",n:"Mehta supplied Julian with digoxin at 9 PM and stopped the clock after finding Edmund dead.",f:"drug",b:"hall"},
guest:{i:"🛏️",t:"The guest wing smells of lavender. Two doors: Mehta’s and Julian’s.",c:[["Search Dr. Mehta’s room","mroom","!v_mroom"],["Search Julian’s room","jroom"]],b:"hall"},
mroom:{t:"Tucked in a shaving kit: a second empty digoxin vial, and a letter from Edmund calling in Mehta’s whole debt, due Monday.",n:"Mehta’s debt was called in, due Monday, and he hid a second digoxin vial.",f:"letter",b:"guest"},
jroom:{t:"Neatly kept. Lavender sachets, a missing dinner jacket, nothing else. Nothing here proves anything.",n:"Julian’s room holds nothing incriminating, though his dinner jacket is missing.",c:[["Search the wardrobe again, thoroughly","jacket","drug,!v_jacket"]],b:"guest"},
jacket:{i:"🧥",t:"At the back of the wardrobe, the missing dinner jacket is wrapped in a towel. In its pocket: a folded note in Julian’s hand. “M, make sure the clock reads 10:50. J.”",n:"A note in Julian’s jacket tells Mehta to make the clock read 10:50.",f:"jnote",b:"guest"},
victor:{i:"🎲",t:"Victor slouches against the wall, jittery.",c:[["Ask about the spare key","v_key","!v_v_key"],["Press him about 9 PM","v_9pm"]]},
v_key:{t:"He cracks. He took the spare key at 8 PM to steal cash, scratched the keyhole, lost his nerve and dumped the key in a flowerpot on the back stairs.",n:"Victor scratched the keyhole while stealing cash, then dumped the spare key.",f:"vkey",c:[["Check the flowerpot","pot"],["Ask what else he saw at 9 PM","v_9pm"]],b:"hall"},
pot:{t:"The spare study key lies in the soil. Nothing else.",n:"The spare key was in the flowerpot; it was never used in the murder.",b:"hall"},
v_9pm:{r:[["vkey|sawvic","v_saw"],["","v_shut"]]},
v_saw:{t:"Cornered, Victor blurts that at 9:15 PM he saw Julian alone in the pantry with the brandy decanter.",n:"Julian was alone in the pantry with the brandy decanter at 9:15 PM.",f:"pantry_clue",b:"hall"},
v_shut:{t:"“I don’t know what you mean.” Victor goes silent and stares at the floor. You gave him no reason to trust you.",n:"Victor clammed up when pressed.",b:"hall"},
dsouza:{i:"🧹",t:"Mrs. Dsouza stands rigid. Julian is watching from across the hall.",c:[["Question her in front of everyone","d_pub"],["Take her aside privately","d_priv"]]},
d_pub:{t:"She answers stiffly: the clock ran fine at 10:30, so someone stopped the pendulum. Her eyes flick to Julian, and she says nothing more.",n:"The grandfather clock was stopped by hand.",b:"hall"},
d_priv:{t:"In the corridor she whispers: at 9:20 PM she found Julian wiping the decanter stopper with a handkerchief, and he asked that Edmund be served brandy, not his usual port.",n:"Julian wiped the decanter stopper at 9:20 PM and asked for brandy instead of port.",f:"pantry_clue",b:"hall"},
clock:{i:"🕰️",t:"The pendulum was held still by hand. White powder dusts the rod, the kind found inside latex gloves. The hands read 10:50.",n:"The clock was stopped at 10:50 by a gloved hand.",b:"hall"},
pantry:{i:"🍷",t:"Two crystal decanters on the sideboard: brandy and port.",c:[["Test the brandy decanter","decant","!v_decant"],["Test the port decanter","port","!v_port"]],b:"hall"},
decant:{t:"The brandy stopper is coated in a chalky, bitter film.",n:"The brandy decanter stopper has a chalky, bitter film.",f:"decanter",b:"pantry"},
port:{t:"The port is clean and untouched.",n:"The port decanter is clean.",b:"pantry"},
julian:{i:"💼",t:"Julian swirls his whiskey, perfectly composed. Too composed?",c:[["Chat casually about the evening","j_chat","!v_j_chat"],["Watch him closely","j_eye"],["Accuse him bluntly","j_blunt"]]},
j_chat:{t:"He says the contract was due to be signed tomorrow, that Mehta left the library at 10:50, and that he never went near the pantry. Easy words, a little too easy.",n:"Julian claims he never entered the pantry and says Mehta left the library at 10:50.",c:[["Watch him closely","j_eye"]],b:"hall"},
j_eye:{t:"His left hand stays buried in his pocket. His right fingertips carry a faint blue-grey stain.",n:"Julian hides his left hand; his fingertips are stained blue-grey.",c:[["Demand he empties his pockets","pocket","!bottle_gone"]],b:"hall"},
j_blunt:{t:"He laughs. “On what evidence?” He excuses himself and is gone for ten minutes. When he returns, his pockets look lighter.",n:"Julian slipped away when accused without proof.",f:"bottle_gone",b:"hall"},
pocket:{i:"🧪",t:"Reluctantly he empties it: an unlabelled brown dropper bottle, empty, and a handkerchief stained blue-grey.",n:"Julian carried an empty dropper bottle and a stained handkerchief.",f:"pocket",b:"hall"},
accuse:{i:"⚖️",t:"The household gathers. Who is the killer?",c:[["Lady Celeste","end_celeste"],["Dr. Mehta","ac_mehta"],["Victor","end_victor"],["Mrs. Dsouza","end_dsouza"],["Julian","ac_julian"],["Julian and Dr. Mehta, together","secret_manor","jnote,drug"],["Not yet, keep investigating","hall"]]},
ac_julian:{g:[["drug","pantry_clue","pocket","decanter"],[4,"win_master"],[2,"win"],[0,"weak"]]},
ac_mehta:{r:[["drug","end_mehta2"],["","end_mehta"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"With four independent proofs, Julian has nowhere to run. He admits he only meant to make Edmund drowsy for the signing, and used far too much. The contract dies with Edmund."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Julian goes pale as your proofs land. He confesses. Not every thread is tied, but a jury will have enough."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Julian, but you lack proof. His lawyer dismantles your case, and he walks free by dawn."},
end_celeste:{e:"Wrong Widow",k:"fail",i:"👩",t:"Lady Celeste is arrested in tears. By morning Julian has signed the contract, and Edmund’s killer toasts the storm."},
end_mehta:{e:"The Doctor Falls",k:"fail",i:"🩺",t:"Mehta is arrested as the poisoner, a debt-ridden doctor with a motive. The real hand behind the poison stays quiet."},
end_mehta2:{e:"Half the Truth",k:"fail",i:"🩺",t:"Mehta is charged as the poisoner. You know he only supplied it, but you named the wrong person at the table."},
end_victor:{e:"Convenient Nephew",k:"fail",i:"🎲",t:"Victor is the perfect suspect: a gambler and an heir. He is arrested, and the case closes with the wrong name on it."},
end_dsouza:{e:"Loyal to the End",k:"fail",i:"🧹",t:"Thirty years of service end in handcuffs. The household is appalled, and the real killer says nothing."},
secret_manor:{e:"The Partners",k:"win",s:1,i:"🗝️",t:"You name them both. Julian’s note proves Mehta stopped the clock on orders, not in panic. Mehta confesses first, then Julian. The vial, the debt and the note tie together a murder planned for weeks."}
}},
{id:"key",title:"The Missing Answer Key",icon:"📝",place:"Greenfield Senior Secondary School",level:"Medium",start:"s0",hub:"hub",hl:"Return to the Principal’s office",S:{
s0:{t:"7:40 AM. The Class 12 Chemistry answer key has vanished from the locked staff room. The exam starts at 10. The Principal looks at you: “Find it.”",c:[["Begin the investigation","hub"]]},
hub:{i:"🏫",t:"The Principal’s office. The clock ticks toward 10 AM. Who or what next?",c:[["Inspect the staff room","room","!v_room"],["Check the CCTV room","cctv","!v_cctv"],["Talk to Pooja, the lab assistant","pooja","!v_p_kind,!v_p_hard"],["Talk to Rohan, the topper","rohan","!v_r_4pm,!v_r_bag"],["Talk to Mrs. Iyer","iyer","!iyer_done"],["Check the gate register","gate","cctvoff,!v_gate"],["Check the security key log","keylog","pooja_gone,!v_keylog"],["Question Mr. Verma","verma","spare|gate|cctvoff|desk"],["Make your accusation","accuse"]]},
room:{i:"🚪",t:"The lock isn’t forced. The door was unlocked at some point, then locked again with a key.",n:"The staff room lock wasn’t forced; it was unlocked, then re-locked.",c:[["Examine the HOD’s desk","desk","!v_desk"],["Check the bins by the door","bins","desk,!v_bins"]],b:"hub"},
desk:{t:"Mr. Verma’s desk: a fountain pen with blue-black ink, and an empty brown envelope slot where the key should be.",n:"Verma’s desk holds a blue-black fountain pen and an empty envelope slot.",f:"desk",b:"room"},
bins:{t:"Crumpled in the bin: a copy shop receipt for 14 pages, dated Thursday 4:15 PM, signed with a blue-black “V”.",n:"A copy shop receipt for 14 pages, signed “V”, dated Thursday 4:15 PM.",f:"receipt",b:"room"},
cctv:{i:"📹",t:"The corridor camera switched off at 9 PM. Someone used the HOD’s login.",n:"Corridor CCTV was switched off at 9 PM with the HOD’s login.",f:"cctvoff",b:"hub"},
gate:{i:"📒",t:"The gate register: Mr. Verma logged back in at 9:40 PM on Thursday, out at 9:55 PM.",n:"The gate register shows Verma re-entering school at 9:40 PM.",f:"gate",b:"hub"},
pooja:{i:"🧪",t:"Pooja twists her lanyard, nervous.",c:[["Ask kindly about the spare key","p_kind"],["Accuse her of the theft","p_hard"]]},
p_kind:{t:"She admits lending the spare key to Mr. Verma on Thursday, 3 to 5 PM. The key tag came back with a blue-black ink smudge. She left school at 5:32 PM.",n:"Pooja lent the spare key to Verma on Thursday 3 to 5 PM; the tag has a blue-black smudge.",f:"spare",b:"hub"},
p_hard:{t:"Pooja bursts into tears and refuses to speak. The Principal glares at you. Maybe the security desk has a record of the spare key.",n:"Pooja refused to talk after being accused.",f:"pooja_gone",b:"hub"},
keylog:{i:"🗝️",t:"The security log: the spare staff room key was signed out to “V” on Thursday at 3 PM, returned at 5 PM.",n:"The security key log shows the spare key signed out to “V” on Thursday 3 to 5 PM.",f:"spare",b:"hub"},
rohan:{i:"🎒",t:"Rohan fidgets, bag on his lap.",c:[["Ask about his visit at 4 PM","r_4pm"],["Ask to check his bag","r_bag"]]},
r_4pm:{t:"He found the staff room unlocked and empty at 4 PM, left a Physics assignment on a desk, and left. His pen is a blue ballpoint.",n:"Rohan found the staff room unlocked and empty at 4 PM; he writes with a ballpoint.",b:"hub"},
r_bag:{t:"He glares and storms off, bag clutched tight. You find nothing, and his parents will hear about it.",n:"Rohan walked out when you asked to search his bag.",b:"hub"},
iyer:{i:"📝",t:"Mrs. Iyer stands calm, arms folded.",c:[["Ask about her email complaint","i_mail"],["Ask about her pen","i_pen"]]},
i_mail:{t:"She emailed that the paper was too easy. She left at 6 PM and went straight home.",n:"Mrs. Iyer complained the paper was too easy and left at 6 PM.",f:"iyer_done",b:"hub"},
i_pen:{t:"She gifted Mr. Verma his fountain pen last Diwali. Hers writes in the same blue-black ink.",n:"Mrs. Iyer and Mr. Verma use the same fountain-pen ink.",f:"iyer_done",b:"hub"},

C.push({id:"fair",title:"The Science Fair Sabotage",icon:"🔬",place:"Greenfield Science Fair, 8:45 AM",level:"Easy",start:"s0",hub:"fair",hl:"Back to the fair floor",S:{
s0:{t:"Judging starts at 11. Ananya’s water purifier, the favourite to win Chemistry, was sabotaged this morning. She is in tears beside her stall. “Someone wants me out.”",c:[["Walk the fair floor","fair"]]},
fair:{i:"🔬",t:"Stalls hum with last-minute nerves. Ananya, Dev, Ms. Rao, Mr. Gupta and the school vlogger Kunal are all within earshot.",c:[["Examine Ananya’s stall","stall","!v_stall"],["Talk to Ananya","ananya","!v_a_kind,!v_a_hard"],["Talk to Dev","dev","!v_d_chat,!v_d_bag"],["Talk to Ms. Rao, the lab technician","rao","!v_r_access,!v_r_hard"],["Talk to Mr. Gupta, a judge","gupta","!v_g_judge"],["Talk to Kunal, filming the fair","kunal","!v_k_nice,!v_k_order"],["Check the lab sign-in register","register","labkey,!rao_closed,!v_register"],["Make your accusation","accuse"]]},
stall:{i:"🧪",t:"The sand layer is caked with salt, the filter is clogged, and a page has been torn from the logbook.",n:"The purifier’s filter was clogged with salt and a logbook page was torn out.",c:[["Inspect the clamp on the tube","tube","!v_tube"],["Study the torn logbook","log","!v_log"]],b:"fair"},
tube:{t:"A fresh thumbprint of blue marker ink sits on the clamp. Ananya only uses black.",n:"A blue marker thumbprint is on the clamp; Ananya only uses black ink.",f:"ink",b:"stall"},
log:{t:"Page 4 holds the imprint of the torn page: “35 g salt per litre clogs it in 10 minutes.” Only her notebook had that test data.",n:"The torn page recorded that 35 g of salt per litre clogs the filter in ten minutes.",f:"ratio",b:"stall"},
ananya:{i:"👧",t:"Ananya wipes her eyes, shaky but listening.",c:[["Ask gently what happened","a_kind"],["Ask if she’s sure she didn’t ruin it herself","a_hard"]]},
a_kind:{t:"She left at 8:00 and returned at 8:40 to find it ruined. She only shared her test numbers with her old lab partner, Dev, last week. She looks lost: “I can’t rebuild it in time.”",n:"Ananya shared her salt test numbers only with her old lab partner Dev.",f:"ana_dev",c:[["Offer to help her rebuild it instead","rebuild"]],b:"fair"},
a_hard:{t:"“You think I did this to myself?” Ananya turns away and says nothing more. The crowd glances over.",n:"Ananya shut down when you doubted her.",f:"ana_closed",b:"fair"},
rebuild:{i:"🛠️",t:"You roll up your sleeves. Spare tubing, fresh sand, a borrowed filter. Ananya’s hands steady as she works through the numbers.",n:"You helped Ananya start rebuilding her purifier.",c:[["Keep working until judging","secret_fair"]]},
dev:{i:"🏸",t:"Dev lounges by his own stall, a blue marker tucked behind his ear.",c:[["Chat casually about the fair","d_chat"],["Ask to search his bag","d_bag"],["Mention the blue thumbprint on the clamp","d_ink","ink"]]},
d_chat:{t:"He jokes that Ananya’s purifier was doomed. “Thirty-five grams of salt a litre and that thing’s toast.” Nobody told you that number.",n:"Dev mentioned the exact 35 g/L salt figure unprompted.",f:"dslip",b:"fair"},
d_bag:{t:"His smile vanishes. “You need a teacher for that.” He walks off, bag clutched, and will not talk to you again.",n:"Dev refused to be searched and walked off.",f:"dev_gone",b:"fair"},
d_ink:{t:"“Everyone uses blue markers,” he says, a little too fast. He tucks his hand into his pocket.",n:"Dev brushed off the blue ink and hid his hand.",b:"fair"},
rao:{i:"🧑‍🔬",t:"Ms. Rao is restocking beakers, tired.",c:[["Ask about lab access","r_access"],["Accuse her of leaving the lab unlocked","r_hard"]]},
r_access:{t:"The spare lab key lives in her unlocked drawer, and everyone knows it. “The sign-in register on the lab wall shows who entered.”",n:"The spare lab key is in an unlocked drawer; the lab register shows entries.",f:"labkey",b:"fair"},
r_hard:{t:"“I’ve done nothing wrong!” She locks the register in her drawer and refuses to help any further.",n:"Ms. Rao locked away the lab register after being accused.",f:"rao_closed",b:"fair"},
register:{i:"📒",t:"The sign-in sheet: 8:10 AM, D. Sethi (Dev), well before the fair opened. 8:25 AM, Ms. Rao.",n:"The lab register shows Dev signed in at 8:10 AM, before the fair opened.",f:"reg",b:"fair"},
gupta:{i:"👨‍🏫",t:"Mr. Gupta checks his judging sheets, brisk and fair.",c:[["Ask about the judging","g_judge"]]},
g_judge:{t:"He admits he questioned Ananya’s citations yesterday, which upset her. He also mentions that Dev asked him how fast salt could clog a filter.",n:"Dev asked Mr. Gupta how fast salt clogs a filter; Gupta had questioned Ananya’s citations.",f:"salt_q",b:"fair"},
kunal:{i:"📸",t:"Kunal swings his camera around, grinning. “Content never sleeps.”",c:[["Ask nicely to see his morning footage","k_nice"],["Order him to hand over the camera","k_order"]]},
k_nice:{t:"He scrolls to a clip: at 8:10 AM, Dev leaves the lab with a small zip bag. At 8:20, Dev hovers near Ananya’s stall.",n:"Kunal’s clip shows Dev leaving the lab with a zip bag at 8:10 AM and near Ananya’s stall at 8:20.",f:"lab810",b:"fair"},
k_order:{t:"“Seriously?” He deletes the morning clips on the spot, jaw tight. “Now there’s nothing to see.”",n:"Kunal deleted his morning footage after you ordered him around.",f:"clip_gone",b:"fair"},
accuse:{i:"⚖️",t:"Judging is about to begin. Who sabotaged the purifier?",c:[["Dev","ac_dev"],["Ms. Rao","end_rao"],["Mr. Gupta","end_gupta"],["Kunal","end_kunal"],["Ananya herself","end_ananya"],["Not yet","fair"]]},
ac_dev:{g:[["ink","ratio","dslip","reg","lab810","salt_q"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"With a pile of proof, Dev admits he swapped the filter to win. Ananya gets a fresh run at judging, and Dev apologises on stage."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Dev crumbles under your evidence and confesses. The judges give Ananya a chance to present again."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You accuse Dev, but your proof is thin. He laughs it off, and Ananya loses her chance."},
end_rao:{e:"Wrong Technician",k:"fail",i:"🧑‍🔬",t:"Ms. Rao is sent home in tears. The real saboteur wins a ribbon."},
end_gupta:{e:"Judge and Jury",k:"fail",i:"👨‍🏫",t:"You accuse a judge with no proof. The fair is stunned, and Mr. Gupta steps down."},
end_kunal:{e:"Camera Shy",k:"fail",i:"📸",t:"Kunal posts a video about being falsely accused, and it goes viral. Nothing is solved."},
end_ananya:{e:"Doubt and Disaster",k:"fail",i:"👧",t:"Ananya is disqualified and devastated. The real culprit smiles from the front row."},
secret_fair:{e:"The Show Goes On",k:"win",s:1,i:"🌟",t:"You give up the chase to help one student. Ananya finishes just in time and wins the Chemistry prize. Dev, watching her work, confesses on his own."}

C.push({id:"violin",title:"The Vanished Violin",icon:"🎻",place:"Heritage Hall, concert night",level:"Medium",start:"s0",hub:"lobby",hl:"Return to the lobby",S:{
s0:{t:"5:30 PM. Heritage Hall smells of rosin and nerves. In two hours the charity concert begins, but its star, the 200-year-old Aurora violin, has vanished from its locked glass case. The hall’s doors have been shut since 4. “Find it,” says the trustee, “or we cancel.”",c:[["Step into the hall","lobby"]]},
lobby:{i:"🎻",t:"Musicians whisper in the foyer. Maestro Iqbal, Tanvi the soloist, Gita the stagehand, hall manager Mr. Sequeira and insurance assessor Prof. Bhatt are all within earshot. The clock keeps ticking.",c:[["Examine the green room","green","!v_green"],["Talk to Tanvi, the soloist","tanvi","!v_t_kind,!v_t_push"],["Talk to Maestro Iqbal","iqbal","!v_i_chat,!v_i_push"],["Talk to Gita, the stagehand","gita","!v_g_ask,!v_g_threat"],["Speak to Prof. Bhatt","b_pol","!v_b_pol"],["Check the loading dock","dock","dockhint,!v_dock"],["Search the manager’s office","office","seqkey,!v_office"],["Question Mr. Sequeira","seq"],["Make your accusation","accuse"]]},
green:{i:"🚪",t:"The glass case lies open. No broken glass, no forced lock, only a faint trail of rosin dust leading toward the loading corridor.",n:"The case was opened with a key, not forced; rosin dust leads toward the loading corridor.",f:"key,dockhint",b:"lobby"},
tanvi:{i:"👩‍🎤",t:"Tanvi grips her bow, pale. She is the soloist, and without the Aurora she must play a lesser instrument.",c:[["Ask kindly how she is","t_kind"],["Suggest she is jealous of the violin","t_push"]]},
t_kind:{t:"She whispers that she tuned the Aurora at 4 PM, put it back and watched Mr. Sequeira lock the case with his master key. He seemed in a hurry. She never touched it again.",n:"Tanvi saw Sequeira lock the case with his master key at 4 PM.",f:"seqkey",b:"lobby"},
t_push:{t:"Her eyes flash. “I would never harm that violin!” She walks out and will not speak to you again. Nobody else in the lobby will meet your gaze.",n:"Tanvi stormed off when you suggested she was jealous.",f:"tanvi_gone",b:"lobby"},
iqbal:{i:"🎼",t:"Maestro Iqbal conducts the air with one hand, clearly irritated.",c:[["Chat about tonight’s programme","i_chat"],["Ask about his argument with the manager","i_push"]]},
i_chat:{t:"He mutters that Mr. Sequeira has been jumpy all week, taking calls in the loading corridor and snapping at the staff. “Money trouble, if you ask me.”",n:"Sequeira has been taking nervous calls in the loading corridor.",f:"dockhint",b:"lobby"},
i_push:{t:"“I am a conductor, not a suspect!” He turns his back and refuses to say another word.",n:"Maestro Iqbal refused to talk after you pressed him.",b:"lobby"},
gita:{i:"🧰",t:"Gita wipes grease off her hands, wary of questions.",c:[["Ask gently what she saw","g_ask"],["Threaten to report her","g_threat"]]},
g_ask:{t:"At 4:50 PM she saw Mr. Sequeira wheel a covered cart to the loading dock. “A blue cloth over it. He told me not to touch it.”",n:"Gita saw Sequeira wheel a cart under a blue cloth to the dock at 4:50 PM.",f:"dockhint,bluecloth",b:"lobby"},
g_threat:{t:"Gita drops her toolbox. “I will lose my job!” She leaves, and the other stagehands close ranks behind her.",n:"Gita left when threatened and the stagehands stopped helping.",f:"gita_gone",b:"lobby"},
b_pol:{i:"📋",t:"Prof. Bhatt flips through his clipboard. “The Aurora’s cover tripled last month. The request was signed by the hall manager, S. Sequeira. Unusual, but legal. It pays out in full if the violin is not recovered by midnight.”",n:"The Aurora’s insurance tripled last month at Sequeira’s request and pays out if the violin is not recovered by midnight.",f:"policy",b:"lobby"},
dock:{i:"📦",t:"The dock register shows a pickup at 5:10 PM: “one violin case, for repair”, signed “S.” Wet tyre marks from a courier van still glisten on the concrete.",n:"The dock register records a violin case collected “for repair” at 5:10 PM, signed “S.”",f:"dock",b:"lobby"},
office:{i:"🗄️",t:"Unpaid bills cover the desk: three months of electricity and wages owed, with a red final notice tucked under a mug. A framed poster hides an empty wall safe.",n:"Sequeira’s desk is buried in unpaid bills and a final notice.",f:"debt",b:"lobby"},
seq:{i:"🧑‍💼",t:"Mr. Sequeira straightens his tie. “A dreadful night for the hall.”",c:[["Chat about the case","s_chat","!v_s_chat"],["Show him the dock register","s_dock","dock,!v_s_dock"],["Show him the insurance papers","s_pol","policy,!v_s_pol"],["Accuse him with no proof","s_blunt","!v_s_blunt"]],b:"lobby"},
s_chat:{t:"He says only he held the case key. “Whoever took it must have wrapped it in that blue cloth from the props room.” He stops. Nobody mentioned a blue cloth.",n:"Sequeira mentioned the blue cloth before anyone told him about it.",f:"slip",b:"seq"},
s_dock:{t:"He tugs his collar. “S is a common initial. Half the staff are S.” His hand trembles as he insists the courier was for an old repair job.",n:"Sequeira brushed off the dock register as a common initial.",b:"seq"},
s_pol:{t:"He goes quiet. “The hall needed protection.” But he cannot explain why the payout deadline falls at midnight, hours before the concert even ends.",n:"Sequeira could not explain the policy rise or the midnight deadline.",b:"seq"},
s_blunt:{t:"He laughs and storms off. “You have nothing.” Ten minutes later the courier van is gone from the dock, and so is any chance of catching it tonight.",n:"The van left the dock after your blunt accusation.",f:"van_gone",b:"lobby"},
accuse:{i:"⚖️",t:"The trustee waits. The clock reads 6:15 PM. Who took the Aurora?",c:[["Mr. Sequeira","ac_seq"],["Tanvi","end_tanvi"],["Maestro Iqbal","end_iqbal"],["Gita","end_gita"],["Prof. Bhatt","end_bhatt"],["Ask Mr. Sequeira to return it quietly","secret_violin","slip,dock,!tanvi_gone,!gita_gone"],["Not yet","lobby"]]},
ac_seq:{r:[["van_gone","end_van"],["","ac_seq2"]]},
ac_seq2:{g:[["key","dock","slip","policy","debt"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs close the net. Sequeira admits he sold the Aurora to a private buyer and counted on the insurance as a second prize. Police stop the courier van at the toll plaza, and the violin is back on stage before the second half."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Sequeira’s story breaks. The courier is traced and the Aurora returns, a little scratched but safe. The concert starts forty minutes late."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Sequeira, but without strong proof he talks his way out. The violin is never found and the concert is cancelled."},
end_van:{e:"The Empty Van",k:"weak",i:"🚚",t:"You were right, but too early and too loud. The van left while you shouted, the Aurora is long gone, and the insurance pays Sequeira anyway."},
end_tanvi:{e:"Wrong Soloist",k:"fail",i:"👩‍🎤",t:"Tanvi is pulled from the concert in tears. She never touched the Aurora, and the thief slips out through the side door."},
end_iqbal:{e:"The Maestro’s Exit",k:"fail",i:"🎼",t:"Maestro Iqbal storms out and the orchestra follows him. The concert collapses while the real thief watches from the back row."},
end_gita:{e:"Blamed Below Stairs",k:"fail",i:"🧰",t:"Gita loses her job on the spot. The one person who noticed the cart is silenced by your accusation."},
end_bhatt:{e:"The Insurer",k:"fail",i:"📋",t:"Prof. Bhatt is escorted out in front of the press. He stays calm, files a complaint, and the hall faces a lawsuit."},
secret_violin:{e:"The Encore",k:"win",s:1,i:"🎶",t:"You take Mr. Sequeira aside and lay out the dock register and the blue cloth. Tired and ashamed, he phones the courier himself. The Aurora is back in its case by 6:50. Tanvi plays the opening bars and the hall rises. Sequeira resigns the next morning, a quiet donor clears the hall’s debts, and nobody innocent is hurt."}

C.push({id:"wedding",title:"The Vanishing Necklace",icon:"💍",place:"Kapadia wedding, mehendi night",level:"Easy",start:"s0",hub:"lawn",hl:"Back to the lawn",S:{
s0:{t:"Mehendi night at the Kapadia wedding. At 8:30 PM the bride’s mother opens the jewellery room and finds the family emerald necklace, an heirloom of four generations, missing from its box. The ceremony must go on in an hour.",c:[["Step onto the lawn","lawn"]]},
lawn:{i:"💍",t:"Marigolds, music and whispers. Mrs. Kapadia, Aunt Vimala, cousin Arjun, photographer Zoya and wedding planner Meenal are all gathered near the stage.",c:[["Examine the jewellery room","room","!v_room"],["Talk to Mrs. Kapadia","mother","!v_m_ask,!v_m_blame"],["Talk to Aunt Vimala","aunt","!v_a_ask,!v_a_push"],["Talk to Arjun, the cousin","arjun","!v_r_chat,!v_r_bag"],["Talk to Zoya, the photographer","zoya","!v_z_nice,!v_z_order"],["Search the decor store","decor","planner_hint,!v_decor"],["Question Meenal, the planner","meenal"],["Make your accusation","accuse"]]},
room:{i:"🚪",t:"A small room off the corridor. The door was locked and the lock is intact. The jewellery box sits on a dressing table beside a pile of untouched gift boxes.",n:"The jewellery room lock was intact and nothing else was disturbed.",c:[["Examine the jewellery box","box","!v_box"]],b:"lawn"},
box:{t:"The emerald necklace lies in its velvet bed, but the stones are too light. Under a lens the clasp is cheap brass instead of gold. A fake. The box was opened with its code, not forced.",n:"The necklace in the box is a replica with a cheap brass clasp; the box was opened with its code.",f:"fake",b:"room"},
mother:{i:"👩‍🦳",t:"Mrs. Kapadia clutches her dupatta, shaken.",c:[["Ask who knows the box code","m_ask"],["Ask if the family could be hiding it","m_blame"]]},
m_ask:{t:"She whispers that only she, her sister Vimala and the planner Meenal were given the code, so Meenal could place decorations safely. She trusts all three.",n:"Only Mrs. Kapadia, Aunt Vimala and the planner Meenal had the box code.",f:"code,planner_hint",b:"lawn"},
m_blame:{t:"“In my own home?” Her voice cracks. She turns away, and the bride’s cousins glare at you.",n:"Mrs. Kapadia shut down when you suggested the family was hiding it.",f:"mother_gone",b:"lawn"},
aunt:{i:"👵",t:"Aunt Vimala fans herself with a programme, furious about the theft.",c:[["Ask kindly where she was","a_ask"],["Accuse her of knowing the code","a_push"]]},
a_ask:{t:"She was in the kitchen from 7:30 to 8:15 PM with six cooks as witnesses. She adds that Meenal kept asking about the family jewels all week.",n:"Aunt Vimala was in the kitchen with witnesses; Meenal kept asking about the jewels.",f:"vimala_ok,planner_hint",b:"lawn"},
a_push:{t:"“How dare you!” She sweeps out and tells the family you cannot be trusted.",n:"Aunt Vimala walked out when accused.",f:"vimala_gone",b:"lawn"},
arjun:{i:"🤹",t:"Arjun grins, a half-eaten laddoo in hand. “Best wedding drama ever.”",c:[["Chat casually about the evening","r_chat"],["Ask to look in his bag","r_bag"]]},
r_chat:{t:"He talks nonstop about the music. Then, by accident: at 7:55 PM he saw the planner’s big tote bag hanging by the jewellery room door, with Meenal nowhere in sight.",n:"Arjun saw Meenal’s tote hanging by the jewellery room door at 7:55 PM.",f:"toteseen,planner_hint",b:"lawn"},
r_bag:{t:"His grin vanishes. “Do I look like a thief?” He packs up and heads for the stage, offended.",n:"Arjun left when you asked to search his bag.",f:"arjun_gone",b:"lawn"},
zoya:{i:"📸",t:"Zoya swings her camera strap, wary. “I shoot, I do not snoop.”",c:[["Ask politely to see her photos","z_nice"],["Order her to hand over the memory card","z_order"]]},
z_nice:{t:"She scrolls: a candid at 7:55 PM shows Meenal in the corridor outside the jewellery room, tote bulging, one hand on the door handle. Meenal had said she never left the main hall.",n:"A 7:55 PM photo shows Meenal at the jewellery room door with a bulging tote.",f:"photo",b:"lawn"},
z_order:{t:"“Excuse me?” She wipes the card on the spot, jaw tight. “Now there is nothing to see.”",n:"Zoya wiped her memory card after you ordered her around.",f:"zoya_gone",b:"lawn"},
decor:{i:"🎀",t:"Behind the stage, the planner’s decor store: crates of marigolds, ribbons, and a big tote bag under a table. Folded in its side pocket is a jeweller’s receipt for a rush replica emerald necklace, signed “M. D.”",n:"A jeweller’s receipt for a rush replica necklace, signed “M. D.”",f:"receipt",b:"lawn"},
meenal:{i:"💼",t:"Meenal smiles professionally, clipboard hugged to her chest. “Terrible, terrible night.”",c:[["Chat about the evening","p_chat","!v_p_chat"],["Show her Zoya’s 7:55 PM photo","p_photo","photo,!v_p_photo"],["Show her the jeweller’s receipt","p_rec","receipt,!v_p_rec"],["Accuse her bluntly","p_blunt","!v_p_blunt"]],b:"lawn"},
p_chat:{t:"She says she never left the main hall during dinner, then sighs. “Poor Mrs. Kapadia, to lose the emerald set on a night like this.” Nobody had told her what the necklace was made of.",n:"Meenal mentioned the emerald set before anyone told her what the necklace was.",f:"slip",b:"meenal"},
p_photo:{t:"Her smile freezes. “I only fetched a ribbon!” But the tote in the photo holds no ribbon, and she cannot explain why she lied about the hall.",n:"Meenal’s claim that she never left the hall fell apart.",b:"meenal"},
p_rec:{t:"“M. D. could be anybody,” she says, but her hands shake. The jeweller’s name is on the slip, and one phone call will confirm it.",n:"Meenal could not explain the receipt signed “M. D.”",b:"meenal"},
p_blunt:{t:"She laughs. “On what evidence?” Ten minutes later she has “gone to check the sound system”, and the tote bag is no longer under the table.",n:"Meenal’s tote bag vanished after your blunt accusation.",f:"tote_gone",b:"lawn"},
accuse:{i:"⚖️",t:"The family waits on the stage steps. Who stole the emerald necklace?",c:[["Meenal, the wedding planner","ac_meenal"],["Aunt Vimala","end_vimala"],["Arjun","end_arjun"],["Zoya, the photographer","end_zoya"],["Mrs. Kapadia, for staging it","end_mother"],["Take Meenal aside and give her a chance to return it","secret_wedding","slip,photo,!mother_gone,!zoya_gone"],["Not yet","lawn"]]},
ac_meenal:{r:[["tote_gone","end_tote"],["","ac_m2"]]},
ac_m2:{g:[["fake","code","photo","receipt","slip"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs close the net. Meenal confesses she sold the emerald necklace to cover her debts and left a replica in its place. The real necklace is recovered the next morning, and the wedding goes on."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Meenal admits the swap under the weight of your evidence. The necklace is recovered and the mehendi continues, a little late."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Meenal, but her confident lies hold. The necklace is never found and the family quietly drops the heirloom ritual."},
end_tote:{e:"The Vanished Tote",k:"weak",i:"👜",t:"You were right, but too loud. The tote left with Meenal, and so did the evidence. Nobody can prove a thing."},
end_vimala:{e:"The Wrong Aunt",k:"fail",i:"👵",t:"Aunt Vimala is humiliated in front of two hundred guests. She was in the kitchen all along, and she does not forgive easily."},
end_arjun:{e:"Prankster’s Peril",k:"fail",i:"🤹",t:"Arjun is marched off the stage, protesting. He only dropped a few pranks, and the real thief hands out the sweets."},
end_zoya:{e:"Shot Down",k:"fail",i:"📸",t:"Zoya packs her camera and leaves, taking every photo of the wedding with her. The family has no pictures and no necklace."},
end_mother:{e:"The Victim’s Fury",k:"fail",i:"👩‍🦳",t:"Mrs. Kapadia, rattled enough to nearly cancel the wedding, orders you off the property. The thief hands her a glass of water."},
secret_wedding:{e:"Happily Ever After",k:"win",s:1,i:"💐",t:"You take Meenal aside beneath the marigold arch and quietly lay out the photo and her slip. Her voice breaks: debts drove her to it. She returns the real necklace from her car within ten minutes. Mrs. Kapadia, who prefers a quiet wedding to a scandal, forgives her. The bride wears the emeralds, and nobody ever finds out."}
}});
C.push({id:"biryani",title:"The Midnight Biryani Bandit",icon:"🍛",place:"Hostel Block C, mess kitchen",level:"Easy",start:"s0",hub:"mess",hl:"Back to the mess hall",S:{
s0:{t:"6:45 AM, Hostel Block C. For the fifth night running, the mess kitchen’s leftover biryani has vanished. Warden Mrs. Nair lowers her voice: even a hidden tray of gulab jamun, known only to her and Cook Ramu, is gone. “Name the culprit before breakfast, or the whole block loses weekend outings.”",c:[["Head to the mess","mess"]]},
mess:{i:"🍛",t:"The mess hall smells of last night’s masala. Cook Ramu, night guard Bahadur, senior Sid and junior Pia are all within earshot, and Mrs. Nair is watching you.",c:[["Inspect the kitchen","kitchen","!v_kitchen"],["Talk to Cook Ramu","ramu","!v_r_ask,!v_r_push"],["Talk to Bahadur, the night guard","guard","!v_g_ask,!v_g_push"],["Talk to Pia, the junior","pia","!v_p_chat,!v_p_push"],["Watch the CCTV in the warden’s office","cctv","camhint,!v_cctv"],["Search Sid’s room","sidroom","sidhint,!v_sidroom"],["Question Sid","sid"],["Make your accusation","accuse"]]},
kitchen:{i:"🚪",t:"The kitchen lock is intact and the shutters are down. Nothing was forced. A few grains of rice are scattered across the floor.",n:"The kitchen lock was not forced; rice grains lie on the floor.",c:[["Follow the rice trail","trail","!v_trail"],["Check the bins","bin","!v_bin"]],b:"mess"},
trail:{t:"The grains climb the back stairs to the third-floor fire exit and stop outside room 3-14. Mrs. Nair’s register says that is Sid’s room.",n:"The rice trail ends outside room 3-14, Sid’s room.",f:"rice,sidhint",b:"kitchen"},
bin:{t:"Crumpled foil in dozens of tiny squares, each pencilled with “₹50”. Somebody packed and priced the food.",n:"The bin holds foil packets marked ₹50: someone was selling the food.",f:"foil",b:"kitchen"},
ramu:{i:"👨‍🍳",t:"Cook Ramu stirs a pot, hurt and defensive. “I would never waste food.”",c:[["Ask kindly about the kitchen key","r_ask"],["Accuse him of selling food","r_push"]]},
r_ask:{t:"He says there are two keys: his own, and the spare on a hook in the warden’s office. The spare’s blue tape has been missing since Monday. The kitchen camera feeds the warden’s screen.",n:"The spare kitchen key’s blue tape is missing, and the kitchen camera feeds the warden’s office.",f:"camhint",b:"mess"},
r_push:{t:"Ramu slams the ladle down. “Thirty years I have fed this hostel!” He walks out, and the kitchen staff stop answering your questions.",n:"Ramu and the kitchen staff stopped helping after you accused him.",f:"ramu_gone",b:"mess"},
guard:{i:"🔦",t:"Bahadur sips chai at the gate, calm and tired.",c:[["Ask about last night","g_ask"],["Say he must have been asleep","g_push"]]},
g_ask:{t:"He made rounds at 12 and 2. At 1:15 AM he saw a hooded figure with a glowing headset slip up the back stairs. He also admits he feeds Bholu, the stray dog, rice scraps at the back gate every night.",n:"Bahadur saw a hooded figure with a headset on the back stairs at 1:15 AM; he feeds the stray Bholu.",f:"dog,camhint",b:"mess"},
g_push:{t:"Bahadur’s face closes. “I did my job.” He turns his chair away and says no more.",n:"Bahadur stopped talking after you called him lazy.",f:"guard_gone",b:"mess"},
pia:{i:"🧒",t:"Pia nibbles a biscuit guiltily. “It was not me, I swear!”",c:[["Chat kindly","p_chat"],["Search her bag","p_push"]]},
p_chat:{t:"She was awake at 1 AM and heard someone humming a gaming theme on the back stairs. “Third floor,” she whispers. “Sid’s floor.” She admits she is hungry because the mess runs out early.",n:"Pia heard a gaming tune on the back stairs at 1 AM, from the third floor.",f:"sidhint",b:"mess"},
p_push:{t:"Her eyes fill. “I only eat what is on my plate!” She runs to her room, and her friends glare at you.",n:"Pia ran off in tears when you searched her bag.",f:"pia_gone",b:"mess"},
cctv:{i:"📹",t:"The kitchen footage at 1:20 AM: a hooded figure unlocks the door with a key taped in blue, loads trays and leaves. A headset cord hangs from the neck, and the left sleeve carries a gaming club badge.",n:"CCTV shows a hooded figure with a headset cord and a gaming club badge using a blue-taped key.",f:"cctv",b:"mess"},
sidroom:{i:"🎮",t:"Room 3-14 is a gamer’s cave. Under the bed: a battered notebook ledger of nightly “orders” with ₹50 tallies, a stack of unused foil, and a roll of blue tape.",n:"Sid’s room holds a ledger of nightly orders, foil and blue tape.",f:"ledger",b:"mess"},
sid:{i:"🧑‍💻",t:"Sid yawns, headset round his neck. “Rough night.”",c:[["Chat about his week","s_chat","!v_s_chat"],["Show him the footage","s_cam","cctv,!v_s_cam"],["Show him the ledger","s_led","ledger,!v_s_led"],["Accuse him with no proof","s_blunt","!ledger,!v_s_blunt"]],b:"mess"},
s_chat:{t:"He grumbles that the mess is a joke, then adds, “Some people would steal even the hidden gulab jamun just to feel something.” Only Mrs. Nair and Ramu knew about that tray.",n:"Sid mentioned the hidden gulab jamun tray that only Ramu and the warden knew about.",f:"slip",b:"sid"},
s_cam:{t:"He shrugs. “Everyone owns a hoodie.” But his left sleeve carries the same club badge, and he tugs it down fast.",n:"Sid’s sleeve carries the same gaming club badge as the figure on CCTV.",b:"sid"},
s_led:{t:"He goes white. “That is a gaming roster.” But the ledger lists biryani orders, and the dates match the five missing nights.",n:"The ledger’s dates match the five nights of missing food.",b:"sid"},
s_blunt:{t:"He laughs it off. “Prove it.” Ten minutes later he has “gone to the gym”, and the notebook under his bed is nowhere to be found.",n:"Sid’s ledger disappeared after your blunt accusation.",f:"ledger_burnt",b:"mess"},
accuse:{i:"⚖️",t:"Mrs. Nair taps her pen. The whole mess watches in silence. Who is the Midnight Biryani Bandit?",c:[["Sid","ac_sid"],["Cook Ramu","end_ramu"],["Bahadur, the guard","end_guard"],["Pia","end_pia"],["Bholu, the stray dog","end_bholu","dog"],["Ask Sid to own up and propose a legit midnight counter","secret_mess","slip,ledger,!ramu_gone,!pia_gone"],["Not yet","mess"]]},
ac_sid:{r:[["ledger_burnt","end_ledger"],["","ac_sid2"]]},
ac_sid2:{g:[["rice","foil","cctv","ledger","slip"],[4,"win_master"],[2,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Five proofs pile up. Sid admits he sold the leftovers at ₹50 a packet to hungry seniors. He repays every rupee, scrubs the mess for a month, and the weekend outings are saved."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Sid confesses under the weight of the evidence. The block keeps its weekend outings, and Ramu starts locking the spare key away."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Sid, but he shrugs and smiles. The thefts continue, and the block loses its weekend outings."},
end_ledger:{e:"The Burnt Ledger",k:"weak",i:"🔥",t:"You were right, but too early. The ledger is ash, Sid has an alibi, and the biryani vanishes again tomorrow."},
end_ramu:{e:"The Cook’s Pride",k:"fail",i:"👨‍🍳",t:"Ramu hands in his apron after thirty years. The kitchen goes cold, and the real bandit enjoys a quiet breakfast."},
end_guard:{e:"Sleeping on Duty",k:"fail",i:"🔦",t:"Bahadur is suspended. Without a night guard the back gate stays open, and the biryani goes missing for another week."},
end_pia:{e:"Hungry Innocence",k:"fail",i:"🧒",t:"Pia is confined to her room for the weekend. She cries over a plate of dry toast while the real thief logs in for a gaming session."},
end_bholu:{e:"Who’s a Good Boy?",k:"fail",i:"🐕",t:"Bholu wags his tail as you accuse him in front of the whole mess. Everyone laughs, the real thief laughs loudest, and Mrs. Nair is not amused."},
secret_mess:{e:"The Midnight Mess Club",k:"win",s:1,i:"🍜",t:"You take Sid aside and show him the ledger and his gulab jamun slip. He sighs and confesses. Mrs. Nair, who admires a good business plan, lets him run a supervised midnight snack counter with Ramu, and gives Bholu a permanent bowl at the gate. Every rupee goes to the hostel sports fund, and nobody loses weekend outings."}
}});
C.push({id:"houseboat",title:"The Houseboat Heist",icon:"🛶",place:"Kuttanad Queen, Alleppey backwaters",level:"Hard",start:"s0",hub:"boat",hl:"Back to the deck",S:{
s0:{t:"7 AM on the Alleppey backwaters. Mrs. Menon’s gold bangles, a family heirloom, are gone from the cabin safe aboard the houseboat Kuttanad Queen. The boat anchored mid-lake at midnight, so the thief is still on board. Captain Joseph finds you: “Please be quick. The next harbour is two hours away.”",c:[["Step onto the deck","boat"]]},
boat:{i:"🛶",t:"Coconut palms drift past. Captain Joseph, Chef Latha, Mr. Menon, newlywed Anika and retired surgeon Dr. Rizvi wait on the sunlit deck, and every one of them has something to say.",c:[["Examine the Menons’ cabin","cabin","!v_cabin"],["Talk to Captain Joseph","captain","!v_c_ask,!v_c_push"],["Talk to Chef Latha","chef","!v_l_ask,!v_l_push"],["Talk to Mr. Menon","menon","!v_m_ask,!v_m_push"],["Talk to Anika","anika","!v_a_ask,!v_a_push"],["Inspect the aft deck","aft","dinghyhint,!v_aft"],["Search Dr. Rizvi’s cabin","rizcabin","baghint,!v_rizcabin"],["Row out to the reeds","reeds","dinghy,!v_reeds"],["Question Dr. Rizvi","riz"],["Make your accusation","accuse"]]},
cabin:{i:"🚪",t:"The Menons’ cabin is neat. The window latch is closed from inside, so no outsider came in. The small brass safe stands shut in the wardrobe.",n:"The cabin window was latched from inside, so the thief was already aboard.",c:[["Examine the safe","safe","!v_safe"]],b:"boat"},
safe:{t:"No dents, no damage. Fine scratches circle the lock, the mark of a thin steel pick, not a code.",n:"Fine scratches around the safe lock suggest a thin steel pick.",f:"pick",c:[["Swab the dial","dial","!v_dial"]],b:"cabin"},
dial:{t:"A faint yellow-brown smear stains the dial. A sniff confirms it: iodine.",n:"The safe dial carries a smear of iodine.",f:"iodine",b:"safe"},
captain:{i:"⚓",t:"Captain Joseph keeps one hand on the wheel, jaw set.",c:[["Ask about last night","c_ask"],["Ask why he held the master key","c_push"]]},
c_ask:{t:"His only spare key never left his belt. At 3 AM he checked the anchor and noticed the little dinghy’s rope retied the wrong way, in a hasty granny knot. “Not my knot.”",n:"The dinghy rope was retied in a hasty granny knot, not the Captain’s.",f:"dinghyhint",b:"boat"},
c_push:{t:"His jaw tightens. “Twenty years on this lake!” He locks the wheelhouse door and will not discuss it further.",n:"Captain Joseph shut the wheelhouse after you doubted him.",f:"captain_gone",b:"boat"},
chef:{i:"🍵",t:"Chef Latha wipes her hands on her apron, tired from a short night.",c:[["Ask about last night","l_ask"],["Ask why she was awake at 2 AM","l_push"]]},
l_ask:{t:"She was brewing tea at 2 AM. She heard the little dinghy motor cough to life at 2:10 and stop at 2:30, and assumed the Captain was checking the anchor.",n:"Chef Latha heard the dinghy motor run from 2:10 to 2:30 AM.",f:"dinghyhint",b:"boat"},
l_push:{t:"“You think I did this?” Chef Latha turns back to her stove and will not say another word.",n:"Chef Latha stopped helping after you questioned her.",f:"chef_gone",b:"boat"},
menon:{i:"🧔",t:"Mr. Menon paces the deck, a damp handkerchief in his hand.",c:[["Ask about the bangles","m_ask"],["Ask about the insurance","m_push"]]},
m_ask:{t:"He admits he raised the insurance on the bangles last month, but swears he was asleep. He adds that Dr. Rizvi read in the lounge until late, his big leather bag always at his feet.",n:"Mr. Menon raised the bangles’ insurance last month; Dr. Rizvi kept his leather bag with him in the lounge.",f:"insured,baghint",b:"boat"},
m_push:{t:"His face reddens. “Get off my deck!” His wife shakes her head sadly as he storms away.",n:"Mr. Menon exploded when you asked about the insurance.",f:"menon_gone,insured",b:"boat"},
anika:{i:"👰",t:"Anika sits on the rail, hugging her knees, eyes red.",c:[["Ask gently what she saw","a_ask"],["Ask what she was hiding","a_push"]]},
a_ask:{t:"She could not sleep and stood on her balcony at 2 AM. She saw someone row the dinghy to the reeds and back, with a cough, and a faint hospital smell hung in the air afterwards.",n:"Anika saw someone row the dinghy to the reeds at 2 AM and smelled antiseptic afterwards.",f:"dinghyhint,baghint",b:"boat"},
a_push:{t:"She bursts into tears. “On my honeymoon?” Her husband leads her away and no one on that side of the deck will meet your eye.",n:"Anika left in tears after you pressed her.",f:"anika_gone",b:"boat"},
aft:{i:"🪢",t:"The dinghy is tied with a clumsy granny knot. A wet size 9 sandal print is drying on the planks.",n:"The dinghy was retied hastily and a wet size 9 sandal print marks the aft deck.",f:"dinghy",b:"boat"},
rizcabin:{i:"🧳",t:"Dr. Rizvi’s cabin is immaculate. His leather bag holds a roll of thin steel surgical picks and a bottle of iodine.",n:"Dr. Rizvi’s bag holds thin steel picks and iodine.",f:"bag",b:"boat"},
reeds:{i:"🌿",t:"You row to the reeds where Anika saw the bundle. Under the water hyacinths, tied to a stick: a waterproof pouch with Mrs. Menon’s bangles and a latex surgical glove.",n:"Mrs. Menon’s bangles were hidden in a waterproof pouch in the reeds with a surgical glove.",f:"pouch",b:"boat"},
riz:{i:"🩺",t:"Dr. Rizvi folds his newspaper, courteous and unhurried. “A terrible business.”",c:[["Chat about the theft","rz_chat","!v_rz_chat"],["Ask about his family","rz_fam","!v_rz_fam"],["Show him the surgical picks","rz_bag","bag,!v_rz_bag"],["Mention the wet size 9 print","rz_wet","dinghy,!v_rz_wet"],["Accuse him with no proof","rz_blunt","!pouch,!v_rz_blunt"]],b:"boat"},
rz_chat:{t:"He sighs. “Anyone with patience and a thin pick could open that little brass safe in minutes.” Nobody had told him how the safe was opened.",n:"Dr. Rizvi mentioned a thin pick before anyone told him how the safe was opened.",f:"slip",b:"riz"},
rz_fam:{t:"His smile fades. His daughter’s long hospital stay has left him buried in debt, and his pension barely covers the interest. “Money is a cruel doctor,” he murmurs.",n:"Dr. Rizvi’s daughter’s hospital bills left him deeply in debt.",f:"daughter",b:"riz"},
rz_bag:{t:"He says he collects antique surgical instruments. His calm is perfect, but he cannot explain the fresh iodine stains on the roll.",n:"Dr. Rizvi could not explain the fresh iodine on his instrument roll.",b:"riz"},
rz_wet:{t:"“Size nine is common.” But his sandals are still damp, and he does not look at you.",n:"Dr. Rizvi’s sandals were still wet at breakfast.",b:"riz"},
rz_blunt:{t:"He smiles. “Do you have anything at all?” He excuses himself, and when you look at the aft deck the dinghy is gone from its rope, taking any hope of finding the bangles with it.",n:"The dinghy vanished after your blunt accusation.",f:"dinghy_gone",b:"boat"},
accuse:{i:"⚖️",t:"Everyone gathers on the deck as the harbour appears on the horizon. Who stole the bangles?",c:[["Dr. Rizvi","ac_riz"],["Captain Joseph","end_captain"],["Chef Latha","end_chef"],["Mr. Menon","end_menon"],["Anika","end_anika"],["Speak to Dr. Rizvi privately about his daughter","secret_boat","slip,bag,daughter,!menon_gone,!anika_gone"],["Not yet","boat"]]},
ac_riz:{r:[["dinghy_gone","end_gone"],["","ac_riz2"]]},
ac_riz2:{g:[["pick","iodine","dinghy","bag","slip","pouch"],[5,"win_master"],[3,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Six proofs leave Dr. Rizvi no way out. He admits he opened the safe with a surgical pick, rowed the bangles to the reeds and meant to retrieve them at dawn. Police meet the boat at the harbour, and Mrs. Menon has her bangles back before lunch."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Dr. Rizvi’s calm cracks under your evidence. He confesses and the bangles are recovered. Mrs. Menon is shaken, but her heirloom is safe."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Dr. Rizvi, but you lack the proof. He politely disembarks at the harbour and the bangles are never seen again."},
end_gone:{e:"The Missing Dinghy",k:"weak",i:"🛶",t:"You named the right man, but the dinghy and the bangles slipped away with the tide. Dr. Rizvi steps off at the harbour, smiling."},
end_captain:{e:"The Captain’s Honour",k:"fail",i:"⚓",t:"Captain Joseph’s only key never left his belt. Twenty years of spotless service end in disgrace, and the owner dismisses him by noon."},
end_chef:{e:"The Tea at Two",k:"fail",i:"🍵",t:"Chef Latha is dismissed on the spot. She only made tea, and the galley goes silent as the thief eats her breakfast."},
end_menon:{e:"The Insurance Man",k:"fail",i:"🧔",t:"Mr. Menon is accused of insurance fraud. His alibi holds, his wife never forgives you, and the real thief sips coconut water."},
end_anika:{e:"Honeymoon Ruined",k:"fail",i:"👰",t:"Anika’s husband carries her sobbing off the boat. She was the best witness you had, and she was innocent."},
secret_boat:{e:"A Surgeon’s Confession",k:"win",s:1,i:"🌅",t:"You sit beside Dr. Rizvi and quietly lay out the pick, the slip and his daughter’s bills. His shoulders sag, and he rows out to the reeds himself to fetch the pouch. Mrs. Menon, moved, refuses to press charges and quietly pays for his daughter’s treatment. The bangles return to the safe, and nobody aboard but you ever knows."}
}});
C.push({id:"arctic",title:"Blackout at Station Nine",icon:"🧊",place:"Polar research station, Svalbard",level:"Hard",start:"s0",hub:"base",hl:"Back to the common room",S:{
s0:{t:"A storm has sealed Station Nine for two days. At 3 AM the power died, and when it returned the lab’s safe cabinet was open and the ice-core data drive, ten years of research, was gone. The supply plane cannot land until the storm passes, so the thief is one of the five people here. Director Lena Hartmann looks at you: “Find it before the plane arrives.”",c:[["Enter the common room","base"]]},
base:{i:"🧊",t:"Wind howls against the walls. Director Lena Hartmann, glaciologist Chidi Okafor, medic and cook Rosa Silva, grad student Tomas Weber and engineer Mikko Laine sit tense around the stove.",c:[["Inspect the lab","lab","!v_lab"],["Visit the generator room","gen","labseen,!v_gen"],["Search the engine shed","shed","shedhint,!v_shed"],["Talk to Lena, the director","lena","!v_l_ask,!v_l_push"],["Talk to Chidi, the glaciologist","chidi","!v_c_ask,!v_c_push"],["Talk to Rosa, the medic","rosa","!v_r_ask,!v_r_push"],["Talk to Tomas, the grad student","tomas","!v_t_ask,!v_t_push"],["Question Mikko, the engineer","mikko"],["Make your accusation","accuse"]]},
lab:{i:"🔬",t:"The safe cabinet stands open with no sign of force. The drive’s empty slot gapes in its foam bed.",n:"The lab safe was opened without force and the data drive is gone.",f:"labseen",c:[["Check the door lock log","lock","!v_lock"],["Examine the floor","floor","!v_floor"]],b:"base"},
lock:{t:"The electronic lock reset itself to fail-open for four minutes at 3:02 AM as power returned, a setting that only the engineer’s override code can trigger.",n:"The lab lock was reset to fail-open for four minutes at 3:02 AM, which needs the engineer’s override.",f:"override",b:"lab"},
floor:{t:"Wet bootprints with a deep zig-zag tread, size 11, lead from the lab door toward the engine shed. The melted snow has not dried.",n:"Size 11 zig-zag bootprints lead from the lab toward the engine shed.",f:"tracks,shedhint",b:"lab"},
gen:{i:"⚡",t:"The main breaker handle was thrown by hand. A fresh grease thumbprint sits on it. Storm surges trip a breaker automatically, but they never flip the handle.",n:"The main breaker was switched off by hand, leaving a grease thumbprint.",f:"breaker",b:"base"},
shed:{i:"🛢️",t:"Inside a spare fuel can, wrapped in a work glove, lies the ice-core drive.",n:"The data drive was hidden in a spare fuel can in the engine shed.",f:"drive",b:"base"},
lena:{i:"👩‍🔬",t:"Lena stands rigid, arms folded, eyes on the stove.",c:[["Ask about the drive’s value","l_ask"],["Ask why she was awake at 3 AM","l_push"]]},
l_ask:{t:"She says an energy firm has offered millions for the data, and only the five of them had the lab code. She was in her bunk when the power failed, and her keycard never left her pocket.",n:"An energy firm wants the data; Lena’s keycard never left her pocket.",f:"motive",b:"base"},
l_push:{t:"“Are you accusing me of stealing my own research?” Lena turns away and will not discuss it again.",n:"Lena shut down when you doubted her.",f:"lena_gone",b:"base"},
chidi:{i:"❄️",t:"Chidi rubs his hands over the stove, tired and pale.",c:[["Ask what he saw","c_ask"],["Ask about his access to the lab","c_push"]]},
c_ask:{t:"He was checking the sample freezer when the lights died. At about 3:10 he saw a flashlight beam crossing the snow toward the engine shed, then it vanished.",n:"Chidi saw a flashlight crossing toward the engine shed at about 3:10 AM.",f:"shedhint",b:"base"},
c_push:{t:"Chidi’s voice rises. “Ten years I have worked on those cores!” He stalks off to his bunk and slams the door.",n:"Chidi stormed off when you questioned his lab access.",f:"chidi_gone",b:"base"},
rosa:{i:"🩺",t:"Rosa stirs a pot of soup, calm but watchful.",c:[["Ask about last night","r_ask"],["Ask if she poisoned the tea to cover it","r_push"]]},
r_ask:{t:"She was in the medical bay with Tomas, who had a fever, from midnight to 4 AM. She also saw the engineer’s boots drying by the stove: big, with a deep tread.",n:"Rosa and Tomas alibi each other; Mikko’s big boots were drying by the stove.",f:"rosa_ok",b:"base"},
r_push:{t:"Her ladle clatters into the pot. “That is absurd.” Rosa refuses to talk and the soup goes cold.",n:"Rosa refused to talk after you accused her.",f:"rosa_gone",b:"base"},
tomas:{i:"🎓",t:"Tomas huddles under a blanket, still feverish.",c:[["Ask what he heard","t_ask"],["Ask about his thesis deadline","t_push"]]},
t_ask:{t:"He heard heavy boots pass his door at 2:55 AM heading for the generator room. They stomped, he says, like the engineer’s always do.",n:"Tomas heard heavy boots heading for the generator room at 2:55 AM.",f:"genhint",b:"base"},
t_push:{t:"“You think I would sell out my own supervisor?” Tomas pulls the blanket over his head and goes silent.",n:"Tomas stopped helping after you pressed him.",f:"tomas_gone",b:"base"},
mikko:{i:"🔧",t:"Mikko leans against the wall, wiping his hands on a rag. “Hell of a night.”",c:[["Chat about the blackout","m_chat","!v_m_chat"],["Show him the bootprints","m_boots","tracks,!v_m_boots"],["Show him the lock log","m_lock","override,!v_m_lock"],["Accuse him with no proof","m_blunt","!drive,!v_m_blunt"]],b:"base"},
m_chat:{t:"He shrugs. “Four minutes with the lock open was all anyone needed.” Nobody had told you the lock opened for four minutes.",n:"Mikko mentioned the four-minute lock window before anyone told him.",f:"slip",b:"mikko"},
m_boots:{t:"“Everyone borrows my boots.” But his own pair is drying by the stove with snow still melting in the tread, and the size matches.",n:"Mikko’s boots match the prints and still had melting snow in the tread.",b:"mikko"},
m_lock:{t:"“Anyone can read the override code in the manual,” he says. The manual is locked in his office.",n:"Only Mikko has the override manual in his office.",b:"mikko"},
m_blunt:{t:"He laughs. “Prove it.” He goes to “check the generator”, and by the time you reach the shed the fuel can is empty and the drive is gone.",n:"The drive vanished from the shed after your blunt accusation.",f:"drive_gone",b:"base"},
accuse:{i:"⚖️",t:"The wind drops for a moment. Everyone looks at you. Who took the data drive?",c:[["Mikko, the engineer","ac_mikko"],["Director Lena","end_lena"],["Chidi","end_chidi"],["Rosa","end_rosa"],["Tomas","end_tomas"],["Offer Mikko a way out before the plane lands","secret_arctic","slip,override,!lena_gone,!chidi_gone"],["Not yet","base"]]},
ac_mikko:{r:[["drive_gone","end_drive"],["","ac_mikko2"]]},
ac_mikko2:{g:[["breaker","override","tracks","drive","slip"],[5,"win_master"],[3,"win"],[0,"weak"]]},
win_master:{e:"Master Detective",k:"win",i:"🏆",t:"Every proof lines up. Mikko admits the energy firm paid him to kill the power, open the lock and hide the drive for collection. Lena locks the drive back in the safe, and the firm is reported when the plane lands."},
win:{e:"Case Closed",k:"win",i:"🔒",t:"Mikko cracks under your evidence and hands over the drive. The research survives, though questions about the buyer remain."},
weak:{e:"Insufficient Proof",k:"weak",i:"😬",t:"You name Mikko, but your proof is thin. He shrugs it off, and when the plane lands the drive is gone with him."},
end_drive:{e:"The Empty Fuel Can",k:"weak",i:"🛢️",t:"You were right, but too early. The drive is somewhere out on the ice, Mikko has an alibi, and ten years of research are lost."},
end_lena:{e:"The Director’s Burden",k:"fail",i:"👩‍🔬",t:"Lena is confined to her bunk while the real thief fixes the heating. She resigns when the plane lands."},
end_chidi:{e:"Cold Shoulder",k:"fail",i:"❄️",t:"Chidi is locked in the storeroom for two days. He never leaves a sample freezer unattended, but the thief did not care."},
end_rosa:{e:"The Wrong Ladle",k:"fail",i:"🩺",t:"Rosa is accused in front of the others and refuses to cook for anyone. The station eats cold rations while the thief smiles."},
end_tomas:{e:"Fever Dream",k:"fail",i:"🎓",t:"Tomas collapses from stress and fever, and his thesis falls apart. The real culprit brings him soup."},
secret_arctic:{e:"The Long Night’s End",k:"win",s:1,i:"🌌",t:"You find Mikko alone in the engine shed and quietly lay out the lock log and his four minutes. He tells you the firm threatened his family. He hands over the drive and agrees to testify. Lena keeps the research and the station funding, and the firm is exposed when the plane lands."}
